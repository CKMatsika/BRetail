<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145e4b">
  <title>Offline · BRetail</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#24342e;background:#f6f8f7}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,480px);background:#fff;border:1px solid #e2e9e5;border-radius:20px;padding:32px;box-shadow:0 18px 48px #19382a12}
    .mark{width:54px;height:54px;border-radius:16px;background:#145e4b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;margin-bottom:24px}
    h1{font-size:26px;line-height:1.2;margin:0 0 12px}p{color:#62736b;line-height:1.65;margin:0 0 22px}
    .note{background:#fff6e9;border:1px solid #f1dfc1;border-radius:12px;color:#704d1c;padding:13px;font-size:13px;line-height:1.5;margin-bottom:22px}
    button{border:0;border-radius:10px;background:#145e4b;color:white;font:inherit;font-weight:650;padding:12px 18px;min-height:46px;cursor:pointer}
    button:focus-visible{outline:3px solid #4a9b7f;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">B</div>
    <h1>You’re offline</h1>
    <p>BRetail could not reach the server. Reconnect to continue to your workspace.</p>
    <div class="note">For your security, this device keeps only the app shell available offline. Sales, stock, payroll and other business changes require a live connection.</div>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
